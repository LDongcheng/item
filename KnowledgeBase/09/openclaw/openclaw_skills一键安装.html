<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawHub 编程技能排行榜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --bg-card: #0c1220;
      --fg: #e8edf5;
      --muted: #5a6b85;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --gold: #ffd700;
      --silver: #c0c8d4;
      --bronze: #cd7f32;
      --border: rgba(90, 107, 133, 0.25);
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    .font-display { font-family: 'Space Grotesk', sans-serif; }

    .bg-pattern {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 212, 170, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 150, 255, 0.05), transparent);
      pointer-events: none;
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none;
    }

    .rank-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .rank-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .rank-item:hover {
      border-color: var(--accent);
      transform: translateX(8px);
      box-shadow: 0 0 40px rgba(0, 212, 170, 0.1);
    }

    .rank-item:hover::before { opacity: 1; }
    .rank-item.top-1 { border-color: rgba(255, 215, 0, 0.4); }
    .rank-item.top-1::before { background: var(--gold); }
    .rank-item.top-2 { border-color: rgba(192, 200, 212, 0.4); }
    .rank-item.top-2::before { background: var(--silver); }
    .rank-item.top-3 { border-color: rgba(205, 127, 50, 0.4); }
    .rank-item.top-3::before { background: var(--bronze); }

    .rank-badge {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
      background: rgba(90, 107, 133, 0.2);
      border: 1px solid var(--border);
    }

    .rank-badge.gold {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 180, 0, 0.1));
      border-color: rgba(255, 215, 0, 0.5);
      color: var(--gold);
    }

    .rank-badge.silver {
      background: linear-gradient(135deg, rgba(192, 200, 212, 0.2), rgba(160, 170, 185, 0.1));
      border-color: rgba(192, 200, 212, 0.5);
      color: var(--silver);
    }

    .rank-badge.bronze {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(180, 100, 30, 0.1));
      border-color: rgba(205, 127, 50, 0.5);
      color: var(--bronze);
    }

    .progress-bar {
      height: 6px;
      background: rgba(90, 107, 133, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), #00ffc8);
      transform-origin: left;
      animation: progressGrow 1s ease-out forwards;
    }

    @keyframes progressGrow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .skill-tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-fundamental { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .tag-advanced { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .tag-practice { background: rgba(0, 212, 170, 0.15); color: var(--accent); }
    .tag-tool { background: rgba(251, 146, 60, 0.15); color: #fb923c; }

    .filter-btn {
      padding: 10px 20px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--fg);
    }

    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .search-input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px 14px 48px;
      color: var(--fg);
      width: 100%;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 212, 170, 0.1);
    }

    .search-input::placeholder { color: var(--muted); }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle at top right, var(--accent-dim), transparent 70%);
      pointer-events: none;
    }

    .rank-item {
      opacity: 0;
      transform: translateY(20px);
    }

    .rank-item.visible {
      animation: slideUp 0.5s ease forwards;
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .difficulty-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }

    .difficulty-dot.filled { background: var(--accent); }

    /* 安装命令样式 */
    .install-command {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(90, 107, 133, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .install-command code {
      font-family: 'Space Grotesk', monospace;
      color: var(--accent);
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--accent-dim);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: rgba(0, 212, 170, 0.25);
      border-color: var(--accent);
    }

    .copy-btn:active {
      transform: scale(0.96);
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.5);
      color: #22c55e;
    }

    /* 提示框 */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .rank-item { padding: 16px; }
      .rank-badge { width: 40px; height: 40px; font-size: 1rem; }
      .install-command { flex-direction: column; align-items: stretch; }
      .install-command code { font-size: 11px; }
      .copy-btn { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    // DOM 元素
    const rankList = document.getElementById('rank-list');

    // 获取分类标签类名
    function getCategoryClass(category) {
      const map = {
        fundamental: 'tag-fundamental',
        advanced: 'tag-advanced',
        practice: 'tag-practice',
        tool: 'tag-tool'
      };
      return map[category] || 'tag-fundamental';
    }

    // 获取分类名称
    function getCategoryName(category) {
      const map = {
        fundamental: '基础',
        advanced: '进阶',
        practice: '实践',
        tool: '工具'
      };
      return map[category] || category;
    }

    // 获取排名样式
    function getTopClass(rank) {
      if (rank === 1) return 'top-1';
      if (rank === 2) return 'top-2';
      if (rank === 3) return 'top-3';
      return '';
    }

    // 获取徽章样式
    function getBadgeClass(rank) {
      if (rank === 1) return 'gold';
      if (rank === 2) return 'silver';
      if (rank === 3) return 'bronze';
      return '';
    }

    // 渲染难度指示器
    function renderDifficulty(level) {
      let html = '<div class="flex gap-1">';
      for (let i = 1; i <= 5; i++) {
        html += `<div class="difficulty-dot ${i <= level ? 'filled' : ''}"></div>`;
      }
      html += '</div>';
      return html;
    }

    // 渲染单个项目
    function renderSkillItem(skill, rank) {
      const topClass = getTopClass(rank);
      const badgeClass = getBadgeClass(rank);

                  <div class="text-xs text-slate-500">综合评分</div>
                </div>
              </div>
              
              <div class="progress-bar mb-3">
                <div class="progress-fill" style="width: ${skill.score}%"></div>
              </div>
              
              <div class="flex flex-wrap items-center gap-4 text-sm mb-3">
                <span class="skill-tag ${getCategoryClass(skill.category)}">${getCategoryName(skill.category)}</span>
                
                <div class="flex items-center gap-1 text-slate-400">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <circle cx="9" cy="7" r="4"/>

                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

                  <span>${skill.learners.toLocaleString()}</span>
                </div>
                
                <div class="flex items-center gap-1 text-emerald-400">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

              </div>
              
              <!-- 安装命令 -->

                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  <span>复制</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 过滤和排序数据
    function getFilteredData() {
      let data = [...skillsData];
      
      if (state.searchTerm) {
        const term = state.searchTerm.toLowerCase();
        data = data.filter(s => 
          s.name.toLowerCase().includes(term) || 
          s.description.toLowerCase().includes(term) ||
          s.tags.some(t => t.toLowerCase().includes(term))
        );
      }
      
      if (state.currentFilter !== 'all') {
        data = data.filter(s => s.category === state.currentFilter);
      }
      
      if (state.currentSort === 'score') {
        data.sort((a, b) => b.score - a.score);
      } else if (state.currentSort === 'learners') {
        data.sort((a, b) => b.learners - a.learners);
      } else if (state.currentSort === 'growth') {
        data.sort((a, b) => b.growth - a.growth);
      }
      
      return data;
    }

    // 显示 Toast
    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 复制到剪贴板
    async function copyToClipboard(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        
        // 更新按钮状态
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>已复制</span>
        `;
        
        showToast();
        
        // 恢复按钮状态
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>复制</span>
          `;
        }, 2000);
      } catch (err) {
        console.error('复制失败:', err);
      }
    }

    // 渲染列表
    function renderList() {
      const data = getFilteredData();
      const toDisplay = data.slice(0, state.displayedCount);
      
      rankList.innerHTML = toDisplay.map((skill, index) => 
        renderSkillItem(skill, index + 1)
      ).join('');
      
      // 触发入场动画
      requestAnimationFrame(() => {
        const items = rankList.querySelectorAll('.rank-item');
        items.forEach((item, i) => {
          setTimeout(() => {
            item.classList.add('visible');
          }, i * 80);
        });
      });
      
      // 绑定复制按钮事件
      const copyBtns = rankList.querySelectorAll('.copy-btn');
      copyBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const command = btn.dataset.command;
          copyToClipboard(command, btn);
        });
      });
      
      loadMoreBtn.style.display = data.length > state.displayedCount ? 'inline-block' : 'none';
    }

    // 设置筛选
    function setupFilters() {
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.currentFilter = btn.dataset.filter;
          state.displayedCount = 12;
          renderList();
        });
      });
    }

    // 设置排序
    function setupSorting() {
      sortBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sortBtns.forEach(b => {
            b.classList.remove('text-emerald-400', 'font-medium');
            b.classList.add('text-slate-500');
          });
          btn.classList.remove('text-slate-500');
          btn.classList.add('text-emerald-400', 'font-medium');
          state.currentSort = btn.dataset.sort;
          renderList();
        });
      });
    }

    // 设置搜索
    function setupSearch() {
      let timeout;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          state.searchTerm = e.target.value;
          state.displayedCount = 12;
          renderList();
        }, 300);
      });
    }

    // 设置加载更多
    function setupLoadMore() {
      loadMoreBtn.addEventListener('click', () => {
        state.displayedCount += 6;
        renderList();
      });
    }

    // 初始化
    function init() {
      renderList();
      setupFilters();
      setupSorting();
      setupSearch();
      setupLoadMore();
    }

    init();
  </script>
</body>
</html>

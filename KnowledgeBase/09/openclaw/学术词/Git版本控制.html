<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 版本控制精通 - OpenClaw 学术词</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #060b14; --bg-card: #0c1420; --fg: #e2e8f0; --muted: #64748b; --accent: #00d4aa; --border: rgba(0, 212, 170, 0.15); }
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; line-height: 1.7; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 1rem; }
    .card:hover { border-color: var(--accent); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .tag { display: inline-block; padding: 4px 12px; background: rgba(0, 212, 170, 0.15); border-radius: 999px; margin: 4px; font-size: 0.875rem; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-3xl mx-auto">
    <a href="index.html" class="text-sm text-[var(--muted)] hover:text-[var(--accent)]">← 返回学术词索引</a>
    <h1 class="font-display text-3xl font-bold mt-6 mb-2" style="background: linear-gradient(135deg, var(--fg), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Git 版本控制精通 (Git Version Control)</h1>
    <p class="text-[var(--muted)] text-sm mb-8">编程技能相关 · 初级阶段</p>

    <section class="card mb-6">
      <h2 class="font-display text-lg font-semibold mb-2 text-[var(--accent)]">学习提示词</h2>
      <p class="text-[var(--muted)] italic">我想学习关于openclaw关于Git版本控制的知识，之所以用html是因为可读性和可拓展性关联性等，让我更好地理解其学术词和学术词有关地其他学术词</p>
    </section>

    <section class="card mb-6">
      <h2 class="font-display text-lg font-semibold mb-3 text-[var(--accent)]">相关学术词</h2>
      <div><span class="tag">版本控制</span><span class="tag">分支管理</span><span class="tag">合并冲突</span><span class="tag">协作工作流</span><span class="tag">代码历史</span></div>
    </section>

    <section class="card">
      <h2 class="font-display text-lg font-semibold mb-3 text-[var(--accent)]">学习要点</h2>
      <ul class="list-disc list-inside space-y-2">
        <li>从基础到高级的版本控制工作流</li>
        <li>掌握分支管理策略</li>
        <li>理解合并与冲突解决</li>
        <li>学会团队协作的最佳实践</li>
      </ul>
    </section>
  </div>
</body>
</html>

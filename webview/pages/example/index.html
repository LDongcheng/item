<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>示例页面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <header id="header" class="bg-blue-500 text-white p-4 flex items-center">
            <button id="backBtn" class="text-xl"><i class="fa fa-arrow-left"></i></button>
            <h1 id="title" class="text-center flex-1 text-lg">示例页面</h1>
        </header>

        <!-- 主内容区 -->
        <main id="content" class="p-4">
            <p id="loadingText" class="text-gray-500 text-center mt-8">加载中...</p>
            <div id="dataContainer" class="hidden">
                <!-- 动态加载的数据将插入到这里 -->
            </div>
        </main>

        <!-- 底部操作 -->
        <footer id="footer" class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-around">
            <button id="navigateBtn" class="px-6 py-2 bg-blue-500 text-white rounded">跳转下一页</button>
        </footer>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- 禁用缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>页面名称</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 页面样式 -->
    <link rel="stylesheet" href="index.css?v=0">
</head>
<body>
    <div id="app" class="w-full h-screen overflow-hidden">
        <!-- 页面内容 -->
    </div>
    <!-- 页面逻辑 -->
    <script>
        window.__VERSION__ = Date.now();
        // 更新 CSS 版本号
        document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
            if (link.href.includes('index.css')) {
                link.href = link.href.split('?')[0] + '?v=' + window.__VERSION__;
            }
        });
    </script>
    <script type="module" src="index.js?v=0"></script>
</body>
</html>
